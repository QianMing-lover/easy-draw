<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Easy Draw - NoobAI XL</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    background: #131322;
    background-image:
      radial-gradient(900px 520px at 12% -8%, rgba(124,58,237,.16), transparent 60%),
      radial-gradient(820px 460px at 96% 2%, rgba(14,165,233,.10), transparent 55%),
      radial-gradient(720px 540px at 55% 112%, rgba(99,102,241,.09), transparent 60%);
    background-attachment: fixed;
    color: #e8e8f0; padding: 24px;
  }
  ::selection { background: rgba(168,85,247,.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: #33335a; border-radius: 999px; border: 2px solid #131322;
  }
  ::-webkit-scrollbar-thumb:hover { background: #47477a; }
  ::-webkit-scrollbar-track { background: transparent; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-size: 23px; margin: 0 0 4px;
    background: linear-gradient(90deg, #c4b5fd, #a78bfa 45%, #7dd3fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #8888aa; font-size: 13px; margin-bottom: 20px; }
  .layout { display: grid; grid-template-columns: 1fr 1.1fr; gap: 20px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.028));
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 16px; padding: 18px;
    box-shadow: 0 10px 34px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
  }
  label { display:block; font-size: 13px; color:#b8b8d0; margin: 10px 0 4px; }
  textarea {
    width: 100%; background: #0e0e1c; color: #e8e8f0; border: 1px solid #33335a;
    border-radius: 8px; padding: 10px; font-size: 14px;
    font-family: inherit; resize: vertical; line-height: 1.5;
  }
  #positive { height: 110px; }
  #negative { height: 56px; }
  select, input {
    background: #0e0e1c; color: #e8e8f0; border: 1px solid #33335a;
    border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
  button {
    width: 100%; margin-top: 16px; padding: 13px; font-size: 16px; font-weight: bold;
    background: linear-gradient(135deg, #7c3aed, #a855f7); color: white;
    border: none; border-radius: 10px; cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { filter: grayscale(.6); cursor: wait; }
  .status { margin-top: 10px; font-size: 13px; color: #8888aa; min-height: 18px; }
  .imgbox {
    display: flex; align-items: center; justify-content: center;
    background: #0e0e1c; border: 1px dashed #33335a; border-radius: 12px;
    min-height: 420px; overflow: hidden;
  }
  .imgbox img { max-width: 100%; max-height: 640px; border-radius: 8px; }
  .placeholder { color: #555577; font-size: 14px; }
  a.dl { display:inline-block; margin-top: 10px; color:#a78bfa; font-size:13px; text-decoration:none; }

  /* ===== 标签面板 ===== */
  .tagpanel { margin-top: 20px; }
  .taghead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom: 10px; }
  .taghead h2 { font-size: 15px; margin: 0; color:#c4b5fd; }
  #tagsearch {
    flex:1; min-width: 200px; background:#0e0e1c; border:1px solid #33335a; border-radius:8px;
    padding:7px 10px; font-size:13px; width:auto;
  }
  .cat { margin-top: 10px; }
  .catname { font-size:12px; color:#8f8fb4; margin: 6px 0; user-select:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    background:#1b1b33; border:1px solid #33335a; color:#cfcfe8;
    padding:4px 10px; border-radius:999px; font-size:12.5px; cursor:pointer;
    transition: background-color .18s ease, border-color .18s ease, color .18s ease,
                transform .12s ease, box-shadow .18s ease;
    white-space:nowrap; will-change:transform;
  }
  .chip:hover {
    border-color:#7c3aed; color:#fff;
    background:linear-gradient(135deg,#7c3aed14,#a855f70d);
    transform:translateY(-1px);
    box-shadow:0 2px 8px rgba(124,58,237,.18);
  }
  .chip:active { transform:scale(.93); transition-duration:.06s; }
  .chip b { font-weight: 500; }
  .chip .cn { color:#9a9ac0; margin-left:5px; font-size:11.5px; transition:color .18s ease; }
  .chip.sel .cn { color:#d9c6ff; }
  .chip.sel {
    background:linear-gradient(135deg,#7c3aed33,#a855f722); border-color:#a855f7;
    color:#e9d8ff; font-weight:600;
    box-shadow:0 0 0 3px rgba(124,58,237,.14), inset 0 1px 0 rgba(255,255,255,.14);
    animation:chipPop .22s ease;
  }
  .chip.nsfwcat { border-color:#7a4a3a; }
  .chip.sel.nsfwcat {
    background:linear-gradient(135deg,#c0392b33,#a855f722); border-color:#c0392b;
    color:#ffd7cf;
    box-shadow:0 0 0 3px rgba(192,57,43,.14), inset 0 1px 0 rgba(255,255,255,.12);
  }
  @keyframes chipPop {
    0% { transform:scale(.9); }
    55% { transform:scale(1.06); }
    100% { transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chip, .chip .cn { transition:none; }
    .chip:hover { transform:none; box-shadow:none; }
    .chip.sel { animation:none; }
  }

  /* ===== 视觉优化 v2 (20261106b) ===== */
  label { transition: color .18s ease; }
  textarea, select, input[type="text"], input[type="password"] {
    transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    caret-color: #a78bfa;
  }
  textarea:hover, select:hover,
  input[type="text"]:hover, input[type="password"]:hover { border-color: #47477a; }
  textarea:focus, select:focus,
  input[type="text"]:focus, input[type="password"]:focus, #tagsearch:focus {
    outline: none; border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124,58,237,.22);
  }
  input[type="checkbox"] { accent-color: #a855f7; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 999px; padding: 0;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
    cursor: pointer; transition: box-shadow .18s ease, filter .18s ease;
  }
  input[type="range"]:hover { filter: brightness(1.15); }
  input[type="range"]:focus { box-shadow: 0 0 0 3px rgba(124,58,237,.22); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(0,0,0,.15);
    box-shadow: 0 2px 6px rgba(0,0,0,.45), inset 0 1px 0 #fff;
    transition: transform .12s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.28); }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(0,0,0,.15);
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  input[type="range"]::-moz-range-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
  }
  button {
    transition: filter .15s ease, transform .12s ease, box-shadow .18s ease;
  }
  button:hover {
    filter: brightness(1.15); transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(124,58,237,.30);
  }
  button:active { transform: translateY(0) scale(.97); transition-duration: .06s; }
  #clearpos:hover, #nlSave:hover { box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .status {
    transition: color .2s ease;
  }
  .imgbox {
    border: 1px solid rgba(255,255,255,.10);
    background:
      radial-gradient(420px 300px at 50% 42%, rgba(124,58,237,.07), transparent 70%),
      #0e0e1c;
  }
  .imgbox img {
    animation: imgIn .35s ease;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  @keyframes imgIn {
    0% { opacity: 0; transform: scale(.975); }
    100% { opacity: 1; transform: scale(1); }
  }
  .placeholder { letter-spacing: .5px; }
  a.dl { transition: color .15s ease; }
  a.dl:hover { color: #c4b5fd; text-decoration: underline; }
  details > summary {
    border-radius: 8px; padding: 6px 10px; margin-top: 4px;
    transition: background-color .15s ease, color .15s ease;
  }
  details > summary:hover { background: rgba(255,255,255,.05); color: #c4b5fd; }
  .catname { transition: color .18s ease; }
  @media (prefers-reduced-motion: reduce) {
    .imgbox img { animation: none; }
    button, textarea, select, input { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 Easy Draw · NoobAI-XL v-pred</h1>
  <div class="sub">本地 ComfyUI 加速中 · RTX 5060 · build 20261109a · 点标签自动拼提示词</div>

  <div class="layout">
    <div class="card">
      <label>✍️ 正面提示词（点击下方标签自动补进这里）</label>
      <textarea id="positive" placeholder="masterpiece, best quality, 1girl, ...">masterpiece, best quality, very aesthetic, 1girl, upper body, looking at viewer, cherry blossoms, night, wind</textarea>

      <label>🚫 负面提示词（不想要的东西，留默认即可）</label>
      <textarea id="negative">worst quality, bad quality, lowres, bad anatomy, bad hands, jpeg artifacts</textarea>

      <div class="row">
        <div>
          <label>生成模式</label>
          <select id="genmode">
            <option value="t2i">文生图</option>
            <option value="i2i">图生图（参考图）</option>
            <option value="charref">角色参考（人物一致）</option>
          </select>
        </div>
        <div id="denoiseBox">
          <label>重绘幅度 <span id="dnv">0.55</span> <span style="color:#666">(角色参考: 1=全新画面)</span></label>
          <input id="denoise" type="range" min="0.1" max="1" step="0.05" value="0.55" oninput="dnv.textContent=this.value">
        </div>
        <div id="ipweightBox">
          <label>角色相似度 <span id="ipv">0.5</span> <span style="color:#666">(低=听提示词, 高=像参考图)</span></label>
          <input id="ipweight" type="range" min="0.3" max="1" step="0.05" value="0.5" oninput="ipv.textContent=this.value">
        </div>
        <div id="refimgBox">
          <label>参考图</label>
          <input id="refimg" type="file" accept="image/png,image/jpeg,image/webp">
        </div>
        <div id="ratioBox">
          <label>画面比例</label>
          <select id="ratio">
            <option value="832x1216">竖图 832×1216</option>
            <option value="1024x1024">方图 1024×1024</option>
            <option value="1216x832">横图 1216×832</option>
            <option value="768x1152">小竖图 768×1152</option>
          </select>
        </div>
        <div>
          <label>步数 <span id="stepsv">28</span></label>
          <input id="steps" type="range" min="16" max="40" value="28" oninput="stepsv.textContent=this.value">
        </div>
        <div>
          <label>CFG <span id="cfgv">5.5</span></label>
          <input id="cfg" type="range" min="3" max="9" step="0.5" value="5.5" oninput="cfgv.textContent=this.value">
        </div>
        <div>
          <label>分级</label>
          <select id="rating">
            <option value="" selected>普通向（不加 tag）</option>
            <option value="rating:sensitive">擦边 / 诱感</option>
            <option value="rating:questionable">暗示向</option>
            <option value="nsfw, rating:explicit">R18 成人向</option>
          </select>
        </div>
        <div>
          <label>🎲 种子（-1 = 每次随机）</label>
          <input id="seed" type="text" value="-1">
        </div>
      </div>

      <button id="go" style="width:100%" onclick="generate()">🚀 开 始 生 成</button>
      <div class="status" id="status"></div>
      <a class="dl" id="dl" style="display:none" target="_blank">⬇ 下载原图</a>
    </div>

    <div class="card">
      <div class="imgbox">
        <span class="placeholder" id="phph">生成结果会显示在这里</span>
        <img id="img" style="display:none">
      </div>
    </div>
  </div>

  <!-- ===== 自然语言转提示词 ===== -->
  <div class="card tagpanel">
    <div class="taghead">
      <h2>🪄 自然语言 → 标准提示词</h2>
      <select id="nlMode" style="width:auto;padding:6px 10px;font-size:13px;">
        <option value="local">本地词典（离线）</option>
        <option value="api">API 深度转换（任意句子）</option>
      </select>
      <label style="margin:0;display:flex;align-items:center;gap:6px;cursor:pointer;" title="转换后自动补上语义相关的场景/氛围/构图标签">
        <input type="checkbox" id="nlExpand" style="width:auto"> ✨ 语义关联扩展
      </label>
      <label style="margin:0;display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="nlReplace" style="width:auto"> 转换后替换（默认追加）
      </label>
    </div>
    <textarea id="nl" placeholder="用中文描述画面，例如：一个金发双马尾少女穿着水手服，坐在教室里看镜头，微笑，夜晚，樱花花瓣飘落" style="height:64px"></textarea>
    <button id="nlgo" style="width:auto;margin-top:10px;padding:9px 18px;font-size:14px;background:linear-gradient(135deg,#0ea5e9,#6366f1);" onclick="nlConvert()">转换为标签 →</button>
    <button id="nlgogen" style="width:auto;margin:10px 0 0 8px;padding:9px 18px;font-size:14px;background:linear-gradient(135deg,#059669,#10b981);" onclick="nlGenerate()">🚀 转换并出图</button>
    <div class="status" id="nlstatus"></div>

    <details id="nlsettings" style="margin-top:12px;">
      <summary style="cursor:pointer;font-size:13px;color:#8f8fb4;">⚙️ API 设置（OpenAI 兼容接口，key 仅存本机浏览器）</summary>
      <label>接口地址（填到版本号即可，如 GLM）</label>
      <input id="nlUrl" placeholder="https://open.bigmodel.cn/api/paas/v4">
      <label>模型名</label>
      <input id="nlModel" placeholder="glm-4-flash（智谱免费款）或 deepseek-chat 等">
      <label>API Key</label>
      <input id="nlKey" type="password" placeholder="粘贴你的 key">
      <button id="nlSave" style="width:auto;margin-top:10px;padding:8px 16px;font-size:13px;background:#33335a;" onclick="saveApiCfg()">保存设置</button>
      <span class="status" id="apisavestatus"></span>
    </details>
  </div>

  <!-- ===== Danbooru 标签面板 ===== -->
  <div class="card tagpanel">
    <div class="taghead">
      <h2>🧷 Danbooru 标准标签库</h2>
      <input id="tagsearch" placeholder="🔍 搜标签：英文 hair / 中文 夜晚、泳装 都行">
      <button id="clearpos" style="width:auto;margin:0;padding:6px 12px;font-size:12px;background:#33335a;">清空正面提示词</button>
    </div>
    <details id="tageditor" style="margin:0 0 10px;">
      <summary style="cursor:pointer;font-size:13px;color:#8f8fb4;">🧩 词库编辑（按组增删待选标签，保存后两端共用）</summary>
      <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;align-items:flex-start;">
        <select id="edGroup" style="width:auto;max-width:300px;"></select>
        <div id="edChips" style="flex:1;min-width:320px;max-height:220px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#0e0e1c;border:1px solid #33335a;border-radius:10px;"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;">
        <input id="edCN" placeholder="中文名" style="width:130px">
        <input id="edEN" placeholder="英文 tag（空格风格，可自定义）" style="width:250px">
        <button id="edAdd" style="width:auto;margin:0;padding:7px 14px;font-size:13px;background:linear-gradient(135deg,#0ea5e9,#6366f1);">＋ 添加到当前组</button>
        <button id="edSave" style="width:auto;margin:0;padding:7px 14px;font-size:13px;background:linear-gradient(135deg,#059669,#10b981);">💾 保存并应用</button>
        <span class="status" id="edStatus" style="margin:0;"></span>
      </div>
    </details>
    <div id="tagbody"></div>
  </div>
</div>

<script>

const tagbody = document.getElementById("tagbody");

    const chips = document.createElement("div");
    chips.className = "chips";
    g.tags.forEach(o => {
      const c = document.createElement("span");
      c.className = "chip" + (g.cnsfw ? " nsfwcat" : "");
      c.innerHTML = "<b>" + o.en + "</b><span class=\"cn\">" + o.cn + "</span>";

      c.onclick = () => toggleTag(o.en);

function posTokens() {
  const p = document.getElementById("positive").value;
  return p.split(",").map(s => s.trim()).filter(Boolean);
}
function refreshSel() {
  const set = new Set(posTokens());
  document.querySelectorAll(".chip").forEach(ch => {
    ch.classList.toggle("sel", set.has(ch.dataset.tag));

}
function toggleTag(tag) {
  const ta = document.getElementById("positive");
  let toks = posTokens();
  if (toks.includes(tag)) {
    toks = toks.filter(t => t !== tag);
  } else {
    toks.push(tag);
  }
  ta.value = toks.join(", ");
  refreshSel();
}

function nl2tags(text) {
  let work = text;
  const found = [];
  const sorted = SYN.slice().sort((a, b) => b[0].length - a[0].length);
  for (const [cn, en] of sorted) {
    if (!work.includes(cn)) continue;
    found.push(en);
    work = work.split(cn).join("▪");
  }
  const leftover = work.replace(/▪/g, "").replace(/[\s,，。.、;；!！?？的是的着一在里上和与穿戴着有很]+/g, "").trim();
  return { tags: [...new Set(found)], leftover };
}

function expandSemantics(tags) {
  const added = new Set();
  const out = tags.slice();
  for (const t of tags) {
    const assoc = ASSOC[t.toLowerCase()];
    if (!assoc) continue;
    for (const a of assoc) {
      if (!tags.includes(a) && !added.has(a)) { added.add(a); out.push(a); }
    }
  }
  return { out, count: added.size };
}

async function nlConvert() {

  if (document.getElementById("nlMode").value === "api") {

      if (j.error) {
        let m = j.error.message || "提交失败";
        if (j.node_errors) {
          const parts = [];
          for (const [nid, ne] of Object.entries(j.node_errors)) {
            const et = (ne.errors || []).map(e => e.message + (e.details ? `(${e.details})` : "")).join("; ");
            parts.push(`节点${nid} ${ne.class_type || ""}: ${et}`);
          }
          if (parts.length) m += " — " + parts.join(" | ");
        }
        st.textContent = "❌ " + m; btn.disabled = false; return;
      }
      const tags = j.tags.split(",").map(s => s.trim()).filter(Boolean);
      applyConverted(tags);
      st.textContent = `✅ API 已转换 ${tags.length} 个标签` + (j.note ? ` ${j.note}` : "");

      st.textContent = "❌ 请求失败：确认 app.py 在运行且网络可达";

    return;

    const before = tags.length;

}

async function generate() {
  const btn = document.getElementById("go");
  const st = document.getElementById("status");
  btn.disabled = true; st.textContent = "正在提交任务…";

  let pos = document.getElementById("positive").value.trim();
  const neg = document.getElementById("negative").value.trim();
  const rating = document.getElementById("rating").value;
  if (pos && !pos.startsWith("masterpiece")) pos = QUALITY + pos;
  if (rating) {
    // 切 R18 时 textarea 已自动注入 nsfw; 提交时只补 rating:explicit, 避免重复
    const r18 = rating === "nsfw, rating:explicit";
    const extra = (r18 && posTokens().includes("nsfw")) ? "rating:explicit" : rating;
    pos = pos ? (pos + ", " + extra) : extra;
  }

  const mode = document.getElementById("genmode").value;
  const denoise = +document.getElementById("denoise").value;
  const ipweight = +document.getElementById("ipweight").value;
  let refName = null;
  if (mode === "i2i" || mode === "charref") {
    const f = document.getElementById("refimg").files[0];
    if (!f) { st.textContent = (mode === "i2i" ? "图生图" : "角色参考") + "模式：请先选择参考图"; btn.disabled = false; return; }
    st.textContent = "📤 上传参考图…";
    let uj = null;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      const b64 = await new Promise((res, rej) => {
        const rd = new FileReader();
        rd.onload = () => res(String(rd.result).split(",")[1]);
        rd.onerror = () => rej(new Error("读取文件失败"));
        rd.readAsDataURL(f);
      });
      const up = await fetch("/upload_b64", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: f.name, data: b64}), signal: ctrl.signal});
      clearTimeout(timer);
      uj = await up.json();
    } catch (e) {
      st.textContent = "❌ 上传超时或服务无响应：请刷新本页面（F5）后重试；若反复出现，双击 StopEasyDraw 再用桌面图标重启";
      btn.disabled = false; return;
    }
    if (!uj || !uj.name) { st.textContent = "参考图上传失败（HTTP " + (uj ? up.status : "?") + "）"; btn.disabled = false; return; }
    refName = uj.name;
  }

  const [w, h] = document.getElementById("ratio").value.split("x").map(Number);
  const steps = +document.getElementById("steps").value;
  let cfg = +document.getElementById("cfg").value;
  let seed = document.getElementById("seed").value.trim();
  seed = (seed === "-1" || seed === "") ? Math.floor(Math.random() * 4294967295) : +seed;

  const wf = {
    "1": {class_type: "CheckpointLoaderSimple", inputs: {ckpt_name: "NoobAI-XL-Vpred-v1.0.safetensors"}},
    "2": {class_type: "ModelSamplingDiscrete", inputs: {model: ["1",0], sampling: "v_prediction", zsnr: true}},
    "15": {class_type: "RescaleCFG", inputs: {model: ["2",0], multiplier: 0.7}},
    "3": {class_type: "CLIPTextEncode", inputs: {text: pos, clip: ["1",1]}},
    "4": {class_type: "CLIPTextEncode", inputs: {text: neg, clip: ["1",1]}},
    "6": {class_type: "KSampler", inputs: {seed, steps, cfg,
        sampler_name: "euler_ancestral", scheduler: "normal",
        denoise: (mode === "t2i" ? 1.0 : denoise),
        model: ["15",0], positive: ["3",0], negative: ["4",0],
        latent_image: (mode === "i2i" ? ["10",0] : (mode === "charref" && denoise < 1 ? ["10",0] : (mode === "charref" ? ["14",0] : ["5",0])))}},
    "7": {class_type: "VAEDecode", inputs: {samples: ["6",0], vae: ["1",2]}},
    "8": {class_type: "SaveImage", inputs: {images: ["7",0], filename_prefix: "easy_ui"}}
  };
  if (mode === "i2i") {
    wf["5"] = {class_type: "LoadImage", inputs: {image: refName}};
    wf["10"] = {class_type: "VAEEncode", inputs: {pixels: ["5",0], vae: ["1",2]}};
  } else if (mode === "charref") {
    wf["5"] = {class_type: "LoadImage", inputs: {image: refName}};
    wf["10"] = {class_type: "VAEEncode", inputs: {pixels: ["5",0], vae: ["1",2]}};
    wf["11"] = {class_type: "IPAdapterModelLoader", inputs: {ipadapter_file: "ip-adapter-plus_sdxl_vit-h.safetensors"}};
    wf["12"] = {class_type: "CLIPVisionLoader", inputs: {clip_name: "clip_vision_h_vith.safetensors"}};
    wf["13"] = {class_type: "IPAdapterAdvanced", inputs: {model: ["1",0], ipadapter: ["11",0], image: ["5",0],
        clip_vision: ["12",0], weight: ipweight, weight_type: "ease out", combine_embeds: "concat",
        start_at: 0, end_at: 1, embeds_scaling: "V only"}};
    wf["2"].inputs.model = ["13",0];
    wf["14"] = {class_type: "EmptyLatentImage", inputs: {width: w, height: h, batch_size: 1}};
  } else {
    wf["5"] = {class_type: "EmptyLatentImage", inputs: {width: w, height: h, batch_size: 1}};
  }

  try {
    const r = await fetch("/prompt", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt: wf}), signal: (window.AbortSignal && AbortSignal.timeout) ? AbortSignal.timeout(60000) : undefined});
    const j = await r.json();
    if (j.error) {
      let m = j.error.message || "提交失败";
      if (j.node_errors) {
        const parts = [];
        for (const [nid, ne] of Object.entries(j.node_errors)) {
          const et = (ne.errors || []).map(e => e.message + (e.details ? `(${e.details})` : "")).join("; ");
          parts.push(`节点${nid} ${ne.class_type || ""}: ${et}`);
        }
        if (parts.length) m += " — " + parts.join(" | ");
      }
      st.textContent = "❌ " + m; btn.disabled = false; return;
    }
    const pid = j.prompt_id;
    const total = Math.round(steps * (w*h >= 1048576 ? 3.2 : 2.5) / 1.2);
    let cnt = 0, waited = 0;
    const maxWait = 600000;
    const tick = setInterval(async () => {
      waited += 2;
      if (waited >= maxWait) {
        clearInterval(tick);
        st.textContent = "⏱ 超过 10 分钟未完成：ComfyUI 可能卡住了。双击 StopEasyDraw.bat 关闭后，再用桌面 Easy Draw 图标重启";
        btn.disabled = false; return;
      }
      let hist;
      try {
        const h2 = await fetch("/history/" + pid);
        hist = await h2.json();
      } catch (e) {
        st.textContent = "⚠ 后端暂时无响应（模型加载或高负载中），继续等待…";
        return;
      }
      if (Object.prototype.hasOwnProperty.call(hist, pid)) {
        clearInterval(tick); hist_done(pid, hist); btn.disabled = false;
      } else {
        cnt += 2;
        const left = Math.max(0, total - cnt);
        st.textContent = left > 0
          ? `⛏️ 模型生成中… 约 ${left}s`
          : `⛏️ 模型生成中… 已等 ${Math.round(waited/60)} 分钟（首次加载大模型较慢属正常）`;
      }
    }, 3000);
  } catch (e) {
    st.textContent = "连接失败，请确认 ComfyUI 已启动"; btn.disabled = false;
  }
}

function hist_done(pid, hist) {
  const st = document.getElementById("status");
  const node = hist[pid]?.outputs?.["8"];
  if (!node || !node.images?.length) { st.textContent = "生成出错，查看 ComfyUI 控制台"; return; }
  const im = node.images[0];
  const url = `/view?filename=${encodeURIComponent(im.filename)}&subfolder=${encodeURIComponent(im.subfolder)}&type=output`;
  const img = document.getElementById("img");
  img.src = url; img.style.display = "block";
  document.getElementById("phph").style.display = "none";
  const dl = document.getElementById("dl");
  dl.href = url; dl.download = im.filename; dl.style.display = "inline-block";
  st.textContent = `✅ 完成!`;
}
</script>
</body>
</html>
